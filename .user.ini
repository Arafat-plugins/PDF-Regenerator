; PDF Regenerator — PHP limits for hosts that run PHP as FPM / CGI / LiteSpeed (cPanel).
; Read automatically by PHP (may take up to 5 minutes to apply). Harmless elsewhere.
upload_max_filesize = 12M
post_max_size = 13M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
display_errors = Off
